<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decida com clareza — Método Saaty (AHP)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="container">
    <h1>Decida com clareza <span>— assistente de decisão (método Saaty/AHP)</span></h1>
    <p class="subtitle">Responda perguntas simples. A matemática fica por nossa conta.</p>
  </div>
</header>

<main class="container">
  <ol id="stepper" class="stepper" aria-label="Progresso">
    <li data-step="1"><span class="dot">1</span><span class="lbl">Decisão</span></li>
    <li data-step="2"><span class="dot">2</span><span class="lbl">Critérios</span></li>
    <li data-step="3"><span class="dot">3</span><span class="lbl">Opções</span></li>
    <li data-step="4"><span class="dot">4</span><span class="lbl">Comparar</span></li>
    <li data-step="5"><span class="dot">5</span><span class="lbl">Resultado</span></li>
  </ol>

  <section id="screen" class="card" aria-live="polite"></section>

  <footer>
    <p>Baseado no método AHP de Thomas Saaty. Sem conta, sem servidor: tudo roda no seu navegador.</p>
  </footer>
</main>
<script src="ahp.js"></script>
</body>
</html>
